{% extends "expenses/base.html" %}

{% block title %}ログイン - お財布見張り番{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-brand">
      <span class="badge-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4.5A1.5 1.5 0 0 1 3 17.5z"/>
          <path d="M3 8.5V7a2 2 0 0 1 2-2h11"/>
          <circle cx="16.5" cy="12.5" r="1.3" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <h1>お財布見張り番</h1>
      <p>使ったお金と、我慢できたお金を記録</p>
    </div>

    {% if form.errors %}
      <div class="auth-error">ユーザー名またはパスワードが正しくありません。</div>
    {% endif %}

    <form method="post" action="">
      {% csrf_token %}
      {# 未ログインで弾かれた元URL(?next=)を引き継ぎ、ログイン後その画面に戻す #}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="auth-field">
        <label>ユーザー名</label>
        <input type="text" name="username" placeholder="ユーザー名" autofocus>
      </div>
      <div class="auth-field">
        <label>パスワード</label>
        <input type="password" name="password" placeholder="パスワード">
      </div>
      <button type="submit" class="auth-submit">ログイン</button>
    </form>

    <div class="auth-foot">
      アカウントをお持ちでない方は <a href="{% url 'register' %}">新規登録</a>
    </div>

  </div>
</div>
{% endblock %}
